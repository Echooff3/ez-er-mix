[workspace]
resolver = "2"
members = ["crates/ezmix-content", "crates/ezmix-dsp", "crates/ezmix-plugin", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ezmix-content = { path = "crates/ezmix-content" }
ezmix-dsp = { path = "crates/ezmix-dsp" }
memmap2 = "0.9"
roxmltree = "0.21"
realfft = "3.5"
plist = "1.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["standalone"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
